services:
  neo4j:
    image: neo4j:5-community
    container_name: vietgraph-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in .env}"
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1G
      NEO4J_server_memory_pagecache_size: 512m
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474"
      - "${NEO4J_BOLT_PORT:-7687}:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_import:/var/lib/neo4j/import
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -a bolt://localhost:7687 -u neo4j -p \"$$NEO4J_PASSWORD\" 'RETURN 1' >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 40s
    networks:
      - vietgraph

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vietgraph-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: sqlite:////app/data/app.db
      STORAGE_DIR: /app/data/documents
      ER_INDEX_DIR: /app/data/entity_resolution/indexes
      ER_REPORT_DIR: /app/data/entity_resolution/reports
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in .env}
      NEO4J_DATABASE: neo4j
      HF_HOME: /models/huggingface
      TRANSFORMERS_CACHE: /models/huggingface
      MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-30}
      LLM_PROVIDER: ${LLM_PROVIDER:-gemini}
      LLM_MODEL: ${LLM_MODEL:-gemini-2.5-flash}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_FALLBACK_API_KEY: ${LLM_FALLBACK_API_KEY:-}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./data:/app/data
      - huggingface_cache:/models/huggingface
    depends_on:
      neo4j:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 90s
    networks:
      - vietgraph

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api/v1
    container_name: vietgraph-frontend
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - vietgraph

volumes:
  neo4j_data:
  neo4j_logs:
  neo4j_import:
  huggingface_cache:

networks:
  vietgraph:
    driver: bridge
